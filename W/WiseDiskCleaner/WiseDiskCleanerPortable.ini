[Launch]
ProgramExecutable=WiseDiskCleaner32\WiseDiskCleaner.exe
ProgramExecutable64=WiseDiskCleaner\WiseDiskCleaner.exe
WorkingDirectory=%FullAppDir%
RunAsAdmin=compile-force
DirectoryMoveOK=yes
SupportsUNC=yes

[FilesMove]
settings\config.ini=%FullAppDir%
settings\DefragOptions.ini=%FullAppDir%
settings\exclusions.dat=%FullAppDir%
settings\UserCustom.ini=%FullAppDir%
settings\Cookie.dat=%FullAppDir%
settings\Types.lst=%FullAppDir%
settings\TipIds.ini=%APPDATA%\Wise Euask

[DirectoriesMove]
WiseDiskCleanerAPPDATA=%APPDATA%\Wise Disk Cleaner

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Wise Euask

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\settings\exclusions.dat
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\settings\exclusions.dat
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\settings\exclusions.dat
Find=%PAL:LastDrive%\
Replace=%PAL:Drive%\